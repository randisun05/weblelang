; Salin ke /etc/supervisor/conf.d/weblelang.conf lalu: supervisorctl reread && supervisorctl update
; Queue worker: WAJIB — notifikasi, dsb. dikirim lewat antrean.
[program:weblelang-queue]
command=php /var/www/weblelang/current/artisan queue:work --tries=3 --backoff=10 --max-time=3600 --sleep=2
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/weblelang/shared/storage/logs/queue.log

; Websocket real-time (opsional, bila BROADCAST_CONNECTION=reverb).
[program:weblelang-reverb]
command=php /var/www/weblelang/current/artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/weblelang/shared/storage/logs/reverb.log

# Nginx untuk VPS tanpa Docker. Salin ke /etc/nginx/sites-available/weblelang lalu aktifkan.
# HTTPS: jalankan `certbot --nginx -d lelang.domainanda.id` setelah konfigurasi ini aktif.
server {
    listen 80;
    listen [::]:80;
    server_name lelang.domainanda.id;
    root /var/www/weblelang/current/public;
    index index.php;

    client_max_body_size 64M;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset Vite berversi hash.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Websocket Laravel Reverb (lihat supervisor.conf).
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

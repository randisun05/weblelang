# Deploy produksi dengan Docker:  docker compose -f docker-compose.prod.yml up -d --build
# Semua konfigurasi dibaca dari file .env di folder yang sama (lihat docs/DEPLOY.md).

x-app: &app
  build:
    context: .
    args:
      VITE_APP_NAME: ${APP_NAME:-WebLelang}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
      VITE_REVERB_HOST: ${REVERB_PUBLIC_HOST:-}
      VITE_REVERB_PORT: ${REVERB_PUBLIC_PORT:-443}
      VITE_REVERB_SCHEME: ${REVERB_PUBLIC_SCHEME:-https}
  image: weblelang:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
  volumes:
    - storage:/app/storage
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    command: web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      SERVER_NAME: ${SERVER_NAME:-:80}
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/up >/dev/null 2>&1 || curl -fsS http://localhost/up >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  queue:
    <<: *app
    command: queue

  scheduler:
    <<: *app
    command: scheduler

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-weblelang}
      MYSQL_USER: ${DB_USERNAME:-weblelang}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env}
      TZ: Asia/Jakarta
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  storage:
  mysql_data:
  caddy_data:
  caddy_config:
